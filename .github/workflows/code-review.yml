name: Jev code review

# Runs the Jev pipeline on every PR in THIS repo and posts a review.
#
# Security model: `pull_request_target` runs THIS workflow file and the reviewer code from the
# base branch, never from the PR, so a PR cannot change what runs with the secrets. The PR is
# checked out only as data (diff + read-only agent tools); nothing from it is installed or
# executed. Fork PRs are still skipped to avoid spending API credit on untrusted PRs.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  # Manual trigger: Actions tab > "Jev code review" > Run workflow, enter a PR number.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

concurrency:
  group: code-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate PR number
        run: '[[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "bad PR number"; exit 1; }'

      # The reviewer runs from the trusted default branch. The PR is checked out separately and
      # is only ever read as data (diff + read-only agent tools), so a PR that edits the reviewer
      # cannot run its own code with the secrets.
      - name: Check out reviewer (trusted default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tool
          persist-credentials: false

      - name: Check out PR (data only)
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/merge
          path: pr
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: tool/uv.lock

      - run: uv sync --frozen --directory tool

      - name: Review PR (Jev pipeline)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JEV_MODE: real
          # Inline comments only for findings at or above this severity (0 cosmetic .. 4 critical).
          # Raise/lower via a repo variable without editing this file.
          MIN_SEVERITY: ${{ vars.REVIEW_MIN_SEVERITY || '3' }}
        working-directory: tool
        run: >-
          uv run codereview review
          --pr "${{ github.server_url }}/${{ github.repository }}/pull/$PR_NUMBER"
          --pipeline jev
          --repo "$GITHUB_WORKSPACE/pr"
          --min-severity "$MIN_SEVERITY"
          --run-id "pr-$PR_NUMBER"
          --post

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-pr-${{ env.PR_NUMBER }}
          path: tool/runs/
          retention-days: 14
